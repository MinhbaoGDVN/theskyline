[package]
name = "theskyline"
version = "0.3.0"
edition = "2021"
build = "src/build.rs"

[dependencies]
discord-rich-presence = "0.2"
macroquad = { version = "0.4", features = ["audio"] }
image = { version = "0.25", default-features = false, features = ["png"] }
[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3

